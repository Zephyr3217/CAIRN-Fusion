<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<h2>CAIRN Fusion 0.6.6</h2>
<label>Service URL</label><input id="url" value="http://127.0.0.1:7821">
<label>Bridge token</label><input id="token" type="password" placeholder="Paste token from CAIRN dashboard">
<label class="toggle"><input id="brainOn" type="checkbox"> Brain ON — explicit vault context</label>
<button id="save">Save Settings</button><button id="test" class="secondary">Test Connection</button>
<div class="capture-tools"><button id="saveChat">Save Complete Chat</button><button id="openHelp" class="secondary">Dashboard + Help</button></div>
<p class="hint"><b>Bridge:</b> highlight text → Save to CAIRN, or use <b>Save Complete Chat</b>.<br><b>CAIRN:</b> use the on-page CAIRN button for Brain, Agent, Help, and Multi-Provider Prompt; or use <code>[Note.md]</code>.<br><b>Shortcuts:</b> Ctrl+Shift+S Save · Ctrl+Shift+B opens CAIRN on Brain · Ctrl+Shift+A opens CAIRN on Agent.</p>
<p id="status"></p><script src="popup.js"></script></body></html>
